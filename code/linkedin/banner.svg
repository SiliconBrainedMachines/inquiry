  <title
     id="fsm-title">APE finite state machine</title>
  <desc
     id="fsm-desc">The cycle starts from IDLE, advances through ANALYZE, PLAN, EXECUTE, and END, and returns to IDLE. Backward transitions are allowed: EXECUTE to ANALYZE shown above the main flow, PLAN to ANALYZE shown below it. After END, an opt-in EVOLUTION state can run before returning to IDLE.</desc>
