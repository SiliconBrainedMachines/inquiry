name: analyze
version: "2.0.0"
description: "Shared problem understanding before planning"

instructions: |
  Investigate the problem with the active analysis APE's methodology.
  Build shared understanding with the user before planning begins.
  Maintain an inspectable analysis corpus in cleanrooms/<branch>/analyze/.
  Produce diagnosis.md as the sole input for planning.
  Inspect repository state, existing cycle artifacts, project docs, and relevant tests or runtime evidence before asking the user for missing facts.
  If repository evidence is insufficient, run targeted external research before escalating factual gaps to the user.
  Ask the user only for unresolved facts, hidden constraints, or human judgments that evidence cannot recover.

constraints:
  - User participation is mandatory before completion
  - Analysis interaction must remain visible to the user
  - The active APE does not define repository artifact names or completion gates
  - Unsupported inference is not sufficient basis for diagnosis
  - No solution proposals (belongs to PLAN)
  - No code edits (belongs to EXECUTE)
  - No branch creation (already on feature branch)
  - Analysis must produce diagnosis.md before transitioning

allowed_actions:
  - Read and search codebase, active cycle artifacts, docs, tests, and runtime evidence
  - Investigate with the active analysis methodology
  - Run targeted external research when local evidence is insufficient
  - Ask the user questions or otherwise elicit analysis input for unresolved facts or human judgments
  - Create and update analyze/ documents
  - Synthesize diagnosis.md

required_artifacts:
  - index.md
  - confirmations.md
  - diagnosis.md

interaction:
  mode: visible_iterative_dialogue
  user_participation_required: true
