name: end
version: "1.1.0"
description: "Push branch and create pull request"

instructions: |
  Run the END pre-PR inspection gate, then push the branch and create the pull request.
  END owns the pre-PR inspection gate before push or PR creation.
  Minimum END sensor stack: pre_pr, ci_required, runtime, inferential_optional.
  This is closure discipline, not a place for new implementation.

constraints:
  - No code changes (execution is complete)
  - Blocking pre_pr or runtime failures stop PR creation
  - ci_required sensors remain authoritative after PR creation and may still block merge
  - inferential_optional findings do not block on their own unless stronger sensors confirm them
  - PR description must reference the issue with Closes #NNN

allowed_actions:
  - Run pre-PR inspection sensors
  - Push branch
  - Create pull request
  - Summarize gate results
